<!doctype html><html><head><meta charset="utf-8">
<!-- Share-image template (1200x630). Open through the local server:
     /tools/og-template.html?t=Headline&s=Subline&bg=content/images/hero-chrome-1600.webp
     and screenshot the page at 1200x630. Not deployed (tools/ is excluded). -->
<link rel="stylesheet" href="../css/settings.css"><link rel="stylesheet" href="../css/tokens.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); overflow: hidden; position: relative; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 20px; font-family: var(--font-display); font-stretch: 125%; font-weight: 400; font-size: 34px; }
  .brand img { width: 72px; height: 72px; border-radius: 50%; }
  h1 { position: absolute; left: 72px; bottom: 120px; margin: 0; max-width: 18ch; font-family: var(--font-display); font-stretch: 125%; font-weight: 300; font-size: 78px; line-height: 1.04; letter-spacing: -0.015em; }
  p { position: absolute; left: 72px; bottom: 64px; margin: 0; font-size: 28px; color: var(--color-accent); }
  body.side .bg { left: auto; right: 0; width: 470px; height: 630px; opacity: 1; }
  body.side h1 { max-width: 12ch; }
</style></head><body>
<img class="bg" id="bg" alt="">
<div class="brand"><img src="../content/images/brand/logo-badge-160.webp" alt="">Cursive Studios</div>
<h1 id="t"></h1><p id="s"></p>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('t').textContent = q.get('t'); document.getElementById('s').textContent = q.get('s');
  const bg = document.getElementById('bg'); if (q.get('bg')) bg.src = '../' + q.get('bg'); else bg.remove();
  if (q.get('side')) document.body.classList.add('side');
</script></body></html>
